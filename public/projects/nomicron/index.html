<script>
    const cards = document.querySelectorAll('.card');
    const cardsArray = Array.from(cards);

    // Select random positions for special cards in first 16 cards
    const downloadCardIndex = Math.floor(Math.random() * 16);
    let rulesCardIndex;
    do {
        rulesCardIndex = Math.floor(Math.random() * 16);
    } while (rulesCardIndex === downloadCardIndex);

    cards.forEach((card, index) => {
      if (index === downloadCardIndex) {
          card.classList.add('hover:invert', 'hover:scale-105', 'transition-all', 'duration-200');
          const link = document.createElement('a');
          link.href = 'nomicron.pdf'; // Placeholder link
          const img = document.createElement('img');
          img.src = 'download-card.png';
          img.className = 'w-full h-full object-cover';
          link.appendChild(img);
          card.appendChild(link);
          return;
      }

      if (index === rulesCardIndex) {
          card.classList.add('hover:invert', 'hover:scale-105', 'transition-all', 'duration-200');
          const link = document.createElement('a');
          link.href = 'rules.html'; // Rules page link
          const img = document.createElement('img');
          img.src = 'rules-card.png';
          img.className = 'w-full h-full object-cover';
          link.appendChild(img);
          card.appendChild(link);
          return;
      }

        const sentences = [
          "Draw two cards.",
          "Skip your next turn.",
          "Play two cards at once, including this one.",
          "Reverse the turn order.",
          "All players must discard one card.",
          "Trade hands with another player.",
          "The next player draws three cards.",
          "You may play an additional card.",
          "All players pass their hands to the left.",
          "Discard your entire hand.",
          "The game direction reverses.",
          "Challenge the previous card played.",
          "Play this card at any time.",
          "Choose who plays next.",
          "Copy the effect of the last card played.",
          "Winner is whoever holds the most pens when deck empties.",
          "Cards can only be played with your non-dominant hand.",
          "Winner is whoever guesses the next rule added.",
          "Rip a card in half to veto any rule.",
          "Cards with red ink can be played upside down.",
          "Game is now a roguelike. Death resets all rules.",
          "Voting is done by rock-paper-scissors. Always.",
          "Shuffle the rules mid-game. New order is retroactive.",
          "The game was rigged from the start. Always was.",
          "Rip a card to delete its rule. You may glue pieces back together to make new rules.",
          "Every rule must be justified with a quote from a made-up ancient philosopher.",
          "All rules apply only on odd-numbered minutes.",
          "This rule exists in a quantum state until observed.",
          "Exchange one word in each rule with its opposite.",
          "Rules can be traded like Pokemon cards.",
          "Time flows backwards every third turn."
          
      ];
        const randomSentence = sentences[Math.floor(Math.random() * sentences.length)];

        // Create a container for the text
        const textContainer = document.createElement('div');
        textContainer.textContent = randomSentence;

        const rotations = ['rotate-0', 'rotate-1', '-rotate-1', 'rotate-2', '-rotate-2'];
        const scales = ['scale-100', 'scale-105', 'scale-95'];
        const fontChoices = ['font-sans', 'font-serif', 'font-mono'];
        const fontSizes = ['text-lg', 'text-xl', 'text-2xl', 'text-md'];
        const verticalAlignments = ['items-start', 'items-center', 'items-end'];
        const horizontalAlignments = ['justify-start', 'justify-center', 'justify-end'];
        const transforms = ['skew-x-1', '-skew-x-1', 'skew-y-1', '-skew-y-1'];
        const textColors = ['text-white'];
        const letterSpacing = ['tracking-tighter', 'tracking-tight', 'tracking-normal', 'tracking-wide', 'tracking-wider'];
        const lineHeights = ['leading-none', 'leading-tight', 'leading-snug', 'leading-normal', 'leading-relaxed'];
        const textTransforms = ['uppercase', 'lowercase', 'capitalize', 'normal-case'];
        const fontWeights = ['font-normal', 'font-medium', 'font-semibold', 'font-bold', 'font-extrabold'];
        const textDecorations = ['underline', 'line-through', 'no-underline', 'no-underline', 'no-underline'];
        const opacities = ['opacity-100'];
        const borderWidths = ['rounded-none', 'rounded-sm', 'rounded-md', 'rounded-lg', 'rounded-xl'];

        card.classList.add(
          'p-3',
          'font-black',
          'flex',
          'hover:scale-105',
          'transition-all',
          'duration-200',
          rotations[Math.floor(Math.random() * rotations.length)],
          scales[Math.floor(Math.random() * scales.length)],
          fontSizes[Math.floor(Math.random() * fontSizes.length)],
          verticalAlignments[Math.floor(Math.random() * verticalAlignments.length)],
          horizontalAlignments[Math.floor(Math.random() * horizontalAlignments.length)],
          transforms[Math.floor(Math.random() * transforms.length)],
          fontChoices[Math.floor(Math.random() * fontChoices.length)],
          textColors[Math.floor(Math.random() * textColors.length)],
          letterSpacing[Math.floor(Math.random() * letterSpacing.length)],
          lineHeights[Math.floor(Math.random() * lineHeights.length)],
          textTransforms[Math.floor(Math.random() * textTransforms.length)],
          fontWeights[Math.floor(Math.random() * fontWeights.length)],
          textDecorations[Math.floor(Math.random() * textDecorations.length)],
          opacities[Math.floor(Math.random() * opacities.length)],
          borderWidths[Math.floor(Math.random() * borderWidths.length)]
        );

        card.appendChild(textContainer);
    });
</script>
